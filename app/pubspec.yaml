name: fsf_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  app_links: ^7.2.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  local_auth_darwin: ^2.0.5
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Ícono de la app (Android e iOS) desde el logo oficial con fondo blanco (D14):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/images/logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/google_g.png # logo «G» oficial de Google (normas de marca, sin modificar)
  # Empaquetadas en la app (licencia SIL OFL 1.1, ver OFL.txt en cada carpeta): no se descargan.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/unbounded/Unbounded-Bold.ttf
          weight: 700

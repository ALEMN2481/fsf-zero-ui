name: DB

on:
  push:
    branches: [main]
    paths: ["supabase/**", "backend/**", ".github/workflows/db.yml"]
  pull_request:
    paths: ["supabase/**", "backend/**", ".github/workflows/db.yml"]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0 # misma versión que la CLI local
      # db + auth + mailpit (el registro con confirmación de correo envía un email).
      - run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: supabase test db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest
      # Claves de desarrollo del stack local (no son secretos del proyecto en la nube).
      - name: Pruebas de integración del backend
        run: |
          eval "$(supabase status -o env)"
          REQUIRE_SUPABASE=1 SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" pytest backend -v
